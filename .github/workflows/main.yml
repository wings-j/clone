name: Build and Release

on:
  push:
    tags:
      - master

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'  # 根据你的项目调整版本
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
